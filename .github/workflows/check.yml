name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Bend release
        run: |
          scripts/install-bend.sh "$HOME/.bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Reference tools for the differential tests
        run: sudo apt-get install -y --no-install-recommends binutils xz-utils e2fsprogs gdisk fdisk python3-cryptography clang dosfstools mtools xorriso genisoimage device-tree-compiler lz4 lzop gcc-multilib iproute2 iputils-ping bzip2 zstd nftables secilc acpica-tools apparmor
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor;
      # tcpip's test against Linux and nftables' nft --check run in one
      # (unshare -rn). This changes only the runner, discarded after the run.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check every package's imports against its DEPS
        run: scripts/deps.sh
      - name: Check no package uses another's unlisted defs
        run: python3 scripts/internals.py
      - name: Check every package
        run: scripts/check.sh
