name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Bend release
        run: |
          scripts/install-bend.sh "$HOME/.bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Reference tools for the differential tests
        run: sudo apt-get install -y --no-install-recommends binutils xz-utils e2fsprogs gdisk fdisk python3-cryptography clang dosfstools mtools xorriso genisoimage device-tree-compiler lz4 lzop gcc-multilib iproute2 iputils-ping bzip2 zstd nftables
      - name: Check every package's imports against its DEPS
        run: scripts/deps.sh
      - name: Check every package
        run: scripts/check.sh
